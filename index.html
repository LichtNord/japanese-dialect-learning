<!DOCTYPE html>  
<html lang="ja">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>方言学習</title>  
  <style>  
    * {  
      box-sizing: border-box;  
      margin: 0;  
      padding: 0;  
    }  
  
    body {  
      font-family: sans-serif;  
      color: #222;  
      background-color: #fff;  
      line-height: 1.6;  
      padding: 20px;  
      max-width: 600px;  
      margin: 0 auto;  
    }  
  
    button {  
      font-family: inherit;  
      font-size: 16px;  
      cursor: pointer;  
      background: #fff;  
      color: #222;  
      border: 1px solid #ccc;  
      border-radius: 6px;  
      padding: 8px 14px;  
    }  
  
    button:hover:not(:disabled) {  
      background: #f5f5f5;  
    }  
  
    button:disabled {  
      opacity: 0.4;  
      cursor: default;  
    }  
  
    button.primary {  
      background: #222;  
      color: #fff;  
      border-color: #222;  
      width: 100%;  
      padding: 12px;  
      font-weight: bold;  
    }  
  
    button.primary:hover:not(:disabled) {  
      background: #444;  
    }  
  
    /* 方言選択リスト */  
    .dialect-list {  
      display: flex;  
      flex-direction: column;  
      gap: 10px;  
      margin-top: 20px;  
    }  
  
    .dialect-btn {  
      text-align: left;  
      padding: 16px;  
      display: flex;  
      justify-content: space-between;  
      align-items: center;  
    }  
  
    /* 学習画面ヘッダー */  
    .header {  
      display: flex;  
      align-items: center;  
      gap: 12px;  
      margin-bottom: 24px;  
    }  
  
    .progress-bar {  
      flex: 1;  
      height: 8px;  
      background: #eee;  
      border-radius: 4px;  
      overflow: hidden;  
    }  
  
    .progress-fill {  
      height: 100%;  
      background: #222;  
      width: 0%;  
      transition: width 0.2s;  
    }  
  
    /* 問題エリア */  
    .direction-label {  
      font-size: 13px;  
      color: #666;  
      margin-bottom: 4px;  
    }  
  
    .retry-badge {  
      display: inline-block;  
      font-size: 12px;  
      border: 1px solid #222;  
      padding: 1px 6px;  
      border-radius: 4px;  
      margin-bottom: 8px;  
    }  
  
    .question-box {  
      font-size: 20px;  
      font-weight: bold;  
      padding: 16px 0;  
      margin-bottom: 16px;  
      border-bottom: 1px solid #eee;  
    }  
  
    /* タップで意味が出る単語 */  
    .word-tip {  
      position: relative;  
      display: inline-block;  
      border-bottom: 2px dotted #666;  
      cursor: pointer;  
    }  
  
    .tooltip {  
      position: absolute;  
      bottom: 130%;  
      left: 50%;  
      transform: translateX(-50%);  
      background: #222;  
      color: #fff;  
      font-size: 13px;  
      font-weight: normal;  
      padding: 6px 10px;  
      border-radius: 4px;  
      white-space: nowrap;  
      z-index: 10;  
    }  
  
    /* 回答エリアと選択肢 */  
    .answer-area {  
      min-height: 54px;  
      border-bottom: 2px solid #ccc;  
      padding: 8px 0;  
      margin-bottom: 20px;  
      display: flex;  
      flex-wrap: wrap;  
      gap: 8px;  
    }  
  
    .word-bank {  
      display: flex;  
      flex-wrap: wrap;  
      gap: 8px;  
      margin-bottom: 24px;  
    }  
  
    .word-btn {  
      padding: 8px 14px;  
    }  
  
    .word-btn.used {  
      background: #eee;  
      color: transparent;  
      border-color: #eee;  
      pointer-events: none;  
    }  
  
    /* 結果・フィードバック */  
    .feedback {  
      padding: 14px;  
      border: 1px solid #ccc;  
      border-radius: 6px;  
      margin-bottom: 16px;  
    }  
  
    .feedback.correct {  
      border-color: #222;  
      background: #f9f9f9;  
    }  
  
    .feedback.wrong {  
      border-color: #222;  
      background: #f2f2f2;  
    }  
  
    .feedback-title {  
      font-weight: bold;  
      margin-bottom: 4px;  
    }  
  
    .hidden {  
      display: none;  
    }  
  </style>  
</head>  
<body>  
  
  <!-- 1. 方言選択画面 -->  
  <div id="select-screen">  
    <div id="dialect-list" class="dialect-list"></div>  
  </div>  
  
  <!-- 2. 学習画面 -->  
  <div id="study-screen" class="hidden">  
    <div class="header">  
      <button id="quit-btn">戻る</button>  
      <div class="progress-bar">  
        <div id="progress-fill" class="progress-fill"></div>  
      </div>  
    </div>  
  
    <div id="retry-badge" class="retry-badge hidden">復習問題</div>  
    <div id="direction-label" class="direction-label"></div>  
    <div id="question-box" class="question-box"></div>  
  
    <div id="answer-area" class="answer-area"></div>  
    <div id="word-bank" class="word-bank"></div>  
  
    <div id="feedback" class="feedback hidden">  
      <div id="feedback-title" class="feedback-title"></div>  
      <div id="feedback-detail"></div>  
    </div>  
  
    <button id="action-btn" class="primary" disabled>確認する</button>  
  </div>  
  
  <!-- 3. 完了画面 -->  
  <div id="complete-screen" class="hidden">  
    <p style="font-size: 20px; font-weight: bold; margin-bottom: 16px;">完了しました</p>  
    <button id="back-home-btn" class="primary">方言一覧に戻る</button>  
  </div>  
  
<script>  
// =====================================================================  
// 【制作者用データ編集エリア】  
// 新しい方言や問題を追加したい場合は、下の DIALECT_DATA を編集してください。  
//  
// ■ 項目の説明  
// name: 方言の名前  
// questions: 問題のリスト  
//   - type: "toStandard"（方言 → 標準語） または "toDialect"（標準語 → 方言）  
//   - tokens: 問題文を単語ごとに区切った配列。  
//             { t: "表示する文字", m: "タップした時に出る意味（不要なら省略可）" }  
//   - answer: 正解の単語を順番に並べた配列  
//   - choices: 選択肢に表示する単語の配列（answerの単語 ＋ ダミーの単語）  
// =====================================================================  
  
const DIALECT_DATA = [  
  {  
    name: "秋田弁",  
    questions: [  
      {  
        type: "toStandard",  
        tokens: [  
          { t: "おはようさん", m: "おはようございます"}  
        ],  
        answer: ["おはようございます"],  
        choices: ["さようなら", "おはようございます"]  
      },  
      {  
        type: "toStandard",  
        tokens: [  
          { t: "まめ" , m: "元気"},  
          { t: "　でらが", m: "ですか" }  
        ],  
        answer: ["元気", "ですか"],  
        choices: ["ありがとう", "元気", "おはようございます", "ですか",]  
      },  
      {  
        type: "toDialect",  
        tokens: [  
          { t: "おはようございます" },  
          { t: "　元気" },  
          { t: "ですか" }  
        ],  
        answer: ["おはようさん", "まめ", "でらが"],  
        choices: ["でらが", "おはようさん", "んだ", "まめ", "へば"]  
      }  
    ]  
  },  
  {  
    name: "土佐弁",  
    questions: [  
      {  
        type: "toStandard",  
        tokens: [  
          { t: "こじゃんと", m: "とても" },  
          { t: "　こんまい", m: "小さい" },  
          { t: "　あい", m: "アユ" }  
        ],  
        answer: ["とても", "小さい", "アユ"],  
        choices: ["急な", "とても", "帰る", "アユ", "小さい"]  
      }  
    ]  
  }  
];  
  
// =====================================================================  
// 以下、システム制御用コード（通常は編集不要です）  
// =====================================================================  
  
let currentQueue = [];      // 出題待ちリスト  
let totalInitialCount = 0;  // 最初の問題数（プログレスバー計算用）  
let completedCount = 0;     // 正解した問題数  
let selectedWords = [];     // ユーザーが選んだ単語リスト  
let isChecked = false;      // 判定済みフラグ  
  
const selectScreen = document.getElementById("select-screen");  
const studyScreen = document.getElementById("study-screen");  
const completeScreen = document.getElementById("complete-screen");  
const dialectList = document.getElementById("dialect-list");  
const progressFill = document.getElementById("progress-fill");  
const retryBadge = document.getElementById("retry-badge");  
const directionLabel = document.getElementById("direction-label");  
const questionBox = document.getElementById("question-box");  
const answerArea = document.getElementById("answer-area");  
const wordBank = document.getElementById("word-bank");  
const feedback = document.getElementById("feedback");  
const feedbackTitle = document.getElementById("feedback-title");  
const feedbackDetail = document.getElementById("feedback-detail");  
const actionBtn = document.getElementById("action-btn");  
  
// 初期表示：方言一覧ボタンを生成  
function init() {  
  dialectList.innerHTML = "";  
  DIALECT_DATA.forEach((dialect, index) => {  
    const btn = document.createElement("button");  
    btn.className = "dialect-btn";  
    btn.innerHTML = `<span>${dialect.name}</span><span>${dialect.questions.length}問</span>`;  
    btn.onclick = () => startLesson(index);  
    dialectList.appendChild(btn);  
  });  
}  
  
// 学習開始  
function startLesson(dialectIndex) {  
  const questions = DIALECT_DATA[dialectIndex].questions;  
  // 問題をコピーしてキューに入れる（isRetryフラグを付与）  
  currentQueue = questions.map(q => ({ ...q, isRetry: false }));  
  totalInitialCount = currentQueue.length;  
  completedCount = 0;  
  
  selectScreen.classList.add("hidden");  
  completeScreen.classList.add("hidden");  
  studyScreen.classList.remove("hidden");  
  
  renderQuestion();  
}  
  
// 現在の問題を描画  
function renderQuestion() {  
  isChecked = false;  
  selectedWords = [];  
  feedback.classList.add("hidden");  
  actionBtn.textContent = "確認する";  
  actionBtn.disabled = true;  
  
  // プログレスバー更新  
  const percent = (completedCount / totalInitialCount) * 100;  
  progressFill.style.width = `${percent}%`;  
  
  const q = currentQueue[0];  
  
  // 再出題バッジの表示切替  
  if (q.isRetry) {  
    retryBadge.classList.remove("hidden");  
  } else {  
    retryBadge.classList.add("hidden");  
  }  
  
  // 翻訳方向の表示  
  directionLabel.textContent = q.type === "toStandard"  
    ? "標準語に訳してください"  
    : "方言に訳してください";  
  
  // 問題文の描画（意味がある単語はタップで吹き出し表示）  
  questionBox.innerHTML = "";  
  q.tokens.forEach(token => {  
    if (token.m) {  
      const span = document.createElement("span");  
      span.className = "word-tip";  
      span.textContent = token.t;  
      span.onclick = (e) => {  
        e.stopPropagation();  
        closeAllTooltips();  
        const tip = document.createElement("div");  
        tip.className = "tooltip";  
        tip.textContent = token.m;  
        span.appendChild(tip);  
      };  
      questionBox.appendChild(span);  
    } else {  
      const span = document.createElement("span");  
      span.textContent = token.t;  
      questionBox.appendChild(span);  
    }  
  });  
  
  // 選択肢をシャッフルして配置  
  const shuffledChoices = [...q.choices].sort(() => Math.random() - 0.5);  
  wordBank.innerHTML = "";  
  shuffledChoices.forEach((word, idx) => {  
    const btn = document.createElement("button");  
    btn.className = "word-btn";  
    btn.textContent = word;  
    btn.dataset.index = idx;  
    btn.onclick = () => selectWord(word, idx, btn);  
    wordBank.appendChild(btn);  
  });  
  
  renderAnswerArea();  
}  
  
// 吹き出しをすべて閉じる  
function closeAllTooltips() {  
  document.querySelectorAll(".tooltip").forEach(el => el.remove());  
}  
document.body.addEventListener("click", closeAllTooltips);  
  
// 選択肢から単語を選ぶ  
function selectWord(word, choiceIndex, btnElement) {  
  if (isChecked) return;  
  btnElement.classList.add("used");  
  selectedWords.push({ word, choiceIndex });  
  renderAnswerArea();  
}  
  
// 回答エリアの描画（タップで取り消し可能）  
function renderAnswerArea() {  
  answerArea.innerHTML = "";  
  selectedWords.forEach((item, idx) => {  
    const btn = document.createElement("button");  
    btn.className = "word-btn";  
    btn.textContent = item.word;  
    btn.onclick = () => {  
      if (isChecked) return;  
      selectedWords.splice(idx, 1);  
      const originalBtn = wordBank.querySelector(`[data-index="${item.choiceIndex}"]`);  
      if (originalBtn) originalBtn.classList.remove("used");  
      renderAnswerArea();  
    };  
    answerArea.appendChild(btn);  
  });  
  
  actionBtn.disabled = selectedWords.length === 0;  
}  
  
// 「確認する」／「次へ」ボタンの処理  
actionBtn.onclick = () => {  
  closeAllTooltips();  
  const q = currentQueue[0];  
  
  if (!isChecked) {  
    // 判定処理  
    isChecked = true;  
    const userAnswer = selectedWords.map(item => item.word).join("");  
    const correctAnswer = q.answer.join("");  
    const isCorrect = userAnswer === correctAnswer;  
  
    feedback.classList.remove("hidden", "correct", "wrong");  
  
    if (isCorrect) {  
      feedback.classList.add("correct");  
      feedbackTitle.textContent = "正解";  
      feedbackDetail.textContent = "";  
      completedCount++;  
      currentQueue.shift(); // キューから削除  
    } else {  
      feedback.classList.add("wrong");  
      feedbackTitle.textContent = "不正解";  
      feedbackDetail.textContent = `正解： ${q.answer.join(" ")}`;  
      // 間違えた問題をリストの最後尾に再追加  
      const failedQuestion = currentQueue.shift();  
      failedQuestion.isRetry = true;  
      currentQueue.push(failedQuestion);  
    }  
  
    actionBtn.textContent = "次へ";  
  } else {  
    // 次の問題へ進む  
    if (currentQueue.length > 0) {  
      renderQuestion();  
    } else {  
      progressFill.style.width = "100%";  
      studyScreen.classList.add("hidden");  
      completeScreen.classList.remove("hidden");  
    }  
  }  
};  
  
// 戻るボタン  
document.getElementById("quit-btn").onclick = () => {  
  studyScreen.classList.add("hidden");  
  selectScreen.classList.remove("hidden");  
};  
  
document.getElementById("back-home-btn").onclick = () => {  
  completeScreen.classList.add("hidden");  
  selectScreen.classList.remove("hidden");  
};  
  
init();  
</script>  
</body>  
</html>
